[workspace]
resolver = "2"
members = ["crates/g6-core", "crates/g6-ffi", "crates/g6-ctl"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bản cho máy iOS: panic = abort (target armv7-apple-ios6 không tháo ngăn xếp được) → mã trên đường FFI không được panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Chạy thử trên PC: vòng lặp điểm ảnh ở mức 0 chậm cả chục lần
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
