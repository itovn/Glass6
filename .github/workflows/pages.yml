# Dựng GitHub Pages từ chính nhánh này (tệp tĩnh: trang chuyển hướng + nguồn Cydia), không qua Jekyll.
# Bộ dựng Pages kiểu cũ ngừng nhận việc ngày 27/11/2026 → chuyển sang Actions (D27 của repo.caominh.net).
name: pages
on:
  push:
    branches: [gh-pages, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
